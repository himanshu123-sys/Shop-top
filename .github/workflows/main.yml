# Shop Top

A Flutter starter shopping app for Android and iPhone.

## Run
1. Install Flutter (stable channel).
2. Extract this project.
3. Run `flutter pub get`.
4. Run `flutter run` for a connected Android/iOS device or emulator.

## Build
Android APK: `flutter build apk --release`
iPhone: `flutter build ios --release` (requires macOS + Xcode).

## Included
Home, categories, product details, cart, account, and checkout placeholder.
Product images currently use public Unsplash image URLs. For production, connect a backend/database, authentication, payment gateway, real product storage, and an admin panel.
